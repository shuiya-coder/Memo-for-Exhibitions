<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出品作品メモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>出品作品メモ</h1>

  <!-- 新しいメモを作るボタン：memo.html を「新規」モードで開く -->
  <p>
    <a class="button" href="memo.html?new=1">＋ 新しいメモ</a>
    <a class="button" href="import.html">PDFを取り込む</a>
  </p>

  <!-- バックアップ：JSONファイルへの書き出しと、ファイルからの読み込み -->
  <p>
    <button type="button" id="export">JSONに書き出す</button>
    <button type="button" id="import">JSONを読み込む</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </p>
  <div class="message" id="message"></div>

  <!-- 検索ボックス：入力するたびに一覧が絞り込まれる -->
  <p>
    <input type="text" id="search" placeholder="検索（作品名・展覧会名・目録情報・メモ・タグ。空白で区切ると、すべてを含むものだけ）">
  </p>

  <p>
    <label class="inline-label"><input type="checkbox" id="favorite-only"> ★ お気に入りだけ表示</label>
  </p>

  <!-- タグでの絞り込み（タグを押すと、そのタグのメモだけ表示） -->
  <div id="tag-filter"></div>

  <p id="count"></p>

  <!-- まとめて削除：メモの左のチェックで選び、「選択したメモを削除」で消す -->
  <p id="bulk">
    <button type="button" id="select-all">表示中のメモをすべて選択</button>
    <button type="button" id="clear-selection">選択を解除</button>
    <button type="button" id="delete-selected" class="danger">選択したメモを削除</button>
    <span id="selected-count"></span>
  </p>

  <div id="list"></div>

  <script src="db.js"></script>
  <script src="search.js"></script>
  <script>
    const message = document.getElementById("message");

    // 「JSONに書き出す」：全メモを1つのファイルとしてダウンロードする
    document.getElementById("export").addEventListener("click", async () => {
      const memos = await MemoDB.getAll();
      const data = { app: "exhibition-memo", version: 1, memos: memos };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "memos-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
      message.textContent = memos.length + " 件を書き出しました";
    });

    // 「JSONを読み込む」：ボタンを押すとファイル選択が開く
    document.getElementById("import").addEventListener("click", () => {
      document.getElementById("file").click();
    });

    document.getElementById("file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = ""; // 同じファイルをもう一度選べるようにする
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        // 形が正しいか確認する（違うファイルを読み込んで壊さないため）
        if (data.app !== "exhibition-memo" || !Array.isArray(data.memos)) {
          throw new Error("このアプリで書き出したJSONではありません");
        }
        const base = MemoDB.create();
        const memos = data.memos.map((m) => {
          if (!m.id) throw new Error("idのないメモが含まれています");
          // 足りない項目は空のメモで補い、書き出し時より後に増えた項目にも対応する
          return { ...base, ...m, catalog: { ...base.catalog, ...m.catalog } };
        });
        if (!confirm(memos.length + " 件を読み込みます。同じメモ（同じid）は読み込んだ内容で上書きされます。よろしいですか？")) return;
        await MemoDB.saveMany(memos);
        message.textContent = memos.length + " 件を読み込みました";
        showList();
      } catch (err) {
        message.textContent = "読み込みに失敗しました：" + err.message;
      }
    });
  </script>
  <script>
    // いま絞り込みに使っているタグ（空なら絞り込みなし）
    let selectedTag = "";

    // 検索の部品（normalize / searchText / matchesQuery）は search.js にある

    // タグ絞り込みのボタンを表示する（タグ名と、そのタグのメモ件数）
    function showTagFilter(allMemos) {
      const counts = {};
      for (const m of allMemos) {
        for (const t of m.tags) counts[t] = (counts[t] || 0) + 1;
      }
      const box = document.getElementById("tag-filter");
      box.innerHTML = "";
      // 選んでいたタグが、削除や読み込みでなくなっていたら絞り込みを解除する
      if (selectedTag && !counts[selectedTag]) selectedTag = "";

      for (const t of Object.keys(counts).sort()) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = t + "（" + counts[t] + "）";
        if (t === selectedTag) b.classList.add("active");
        // もう一度押すと絞り込みを解除する
        b.addEventListener("click", () => {
          selectedTag = (selectedTag === t) ? "" : t;
          showList();
        });
        box.appendChild(b);
      }
    }

    // ----- まとめて削除 -----
    // チェックされたメモのid。検索やタグで表示が変わっても、見えているメモの分は残る
    const selected = new Set();
    // 今、画面に出ているメモ（「すべて選択」の対象）
    let visibleMemos = [];

    // 選んだ件数の表示と、ボタンの使える・使えないを更新する
    function updateBulk() {
      document.getElementById("selected-count").textContent =
        selected.size ? selected.size + " 件を選択中" : "";
      document.getElementById("delete-selected").disabled = selected.size === 0;
      document.getElementById("clear-selection").disabled = selected.size === 0;
      document.getElementById("select-all").disabled = visibleMemos.length === 0;
    }

    document.getElementById("select-all").addEventListener("click", () => {
      visibleMemos.forEach((m) => selected.add(m.id));
      showList();
    });

    document.getElementById("clear-selection").addEventListener("click", () => {
      selected.clear();
      showList();
    });

    document.getElementById("delete-selected").addEventListener("click", async () => {
      // 画面に見えているメモだけを削除の対象にする（見えていないメモを巻き込まないため）
      const targets = visibleMemos.filter((m) => selected.has(m.id));
      if (targets.length === 0) return;

      // 確認ダイアログには、件数と、先頭の数件の作品名を出す
      const names = targets.slice(0, 5).map((m) => "・" + (m.title || "（作品名なし）")).join("\n");
      const more = targets.length > 5 ? "\n…ほか " + (targets.length - 5) + " 件" : "";
      const ok = confirm(
        targets.length + " 件のメモを削除します。元に戻せません。\n\n" + names + more +
        "\n\n心配なら、先に「JSONに書き出す」でバックアップできます。\nよろしいですか？");
      if (!ok) return;

      await MemoDB.removeMany(targets.map((m) => m.id));
      targets.forEach((m) => selected.delete(m.id));
      message.textContent = targets.length + " 件のメモを削除しました";
      showList();
    });

    // 一覧を表示する
    async function showList() {
      const allMemos = await MemoDB.getAll();
      showTagFilter(allMemos);
      // 更新が新しい順に並べる
      allMemos.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
      // タグと検索の言葉、両方の条件に合うメモだけにする
      const query = document.getElementById("search").value;
      const favoriteOnly = document.getElementById("favorite-only").checked;
      const memos = allMemos.filter((m) =>
        (!selectedTag || m.tags.includes(selectedTag)) &&
        (!favoriteOnly || m.favorite) &&
        matchesQuery(m, query));

      // 絞り込みで見えなくなったメモは、選択から外す
      visibleMemos = memos;
      const visibleIds = new Set(memos.map((m) => m.id));
      for (const id of [...selected]) if (!visibleIds.has(id)) selected.delete(id);

      const filtered = selectedTag || query.trim() || favoriteOnly;
      document.getElementById("count").textContent = filtered
        ? memos.length + " 件が見つかりました（全 " + allMemos.length + " 件中）"
        : memos.length + " 件のメモ";
      const list = document.getElementById("list");
      list.innerHTML = "";

      for (const m of memos) {
        const div = document.createElement("div");
        div.className = "memo-item";

        const h2 = document.createElement("h2");
        const a = document.createElement("a");
        a.href = "memo.html?id=" + encodeURIComponent(m.id);
        a.textContent = m.title || "（作品名なし）";
        // 削除用のチェックボックス
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = selected.has(m.id);
        cb.title = "このメモを選ぶ";
        cb.addEventListener("change", () => {
          if (cb.checked) selected.add(m.id); else selected.delete(m.id);
          updateBulk();
        });
        cb.style.marginRight = "8px";
        // お気に入りの★ボタン：押すとその場で付け外しができる（古いメモは favorite が未設定で、★なし）
        const star = document.createElement("button");
        star.type = "button";
        star.className = "star" + (m.favorite ? " on" : "");
        star.textContent = m.favorite ? "★" : "☆";
        star.title = m.favorite ? "お気に入りを外す" : "お気に入りに入れる";
        star.addEventListener("click", async () => {
          await MemoDB.setFavorite(m.id, !m.favorite);
          showList();
        });
        h2.append(cb, star, a);

        const sub = document.createElement("div");
        sub.className = "sub";
        // textContent を使うと、入力した文字がそのまま表示され、安全です
        sub.textContent = [m.exhibition, m.catalog.author, m.catalog.period]
          .filter(Boolean).join(" ／ ");

        // このメモに付いているタグを表示する
        const tags = document.createElement("div");
        for (const t of m.tags) {
          const chip = document.createElement("span");
          chip.className = "tag";
          chip.textContent = t;
          tags.appendChild(chip);
        }

        div.append(h2, sub, tags);
        list.appendChild(div);
      }
      updateBulk();
    }
    // 検索ボックスに入力するたびに一覧を更新する
    document.getElementById("search").addEventListener("input", showList);
    document.getElementById("favorite-only").addEventListener("change", showList);
    showList();
  </script>
</body>
</html>
