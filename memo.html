<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メモ - 出品作品メモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">← 一覧へ戻る</a></p>
  <h1 id="heading">メモ</h1>

  <form id="form">
    <label for="title">作品名</label>
    <input type="text" id="title">

    <label for="exhibition">展覧会名</label>
    <input type="text" id="exhibition">

    <fieldset>
      <legend>出品目録の情報</legend>
      <label for="no">目録番号</label>
      <input type="text" id="no">
      <label for="designation">文化財指定</label>
      <input type="text" id="designation" placeholder="例：国宝、重要文化財">
      <label for="author">作者名</label>
      <input type="text" id="author">
      <label for="period">時代・制作年代</label>
      <input type="text" id="period">
      <label for="place">制作地</label>
      <input type="text" id="place">
      <label for="quantity">員数</label>
      <input type="text" id="quantity">
      <label for="holder">所蔵者</label>
      <input type="text" id="holder">
      <label for="section">章・区分</label>
      <input type="text" id="section">
    </fieldset>

    <label for="tag-input">タグ</label>
    <div id="tags"></div>
    <input type="text" id="tag-input" list="tag-suggestions" placeholder="タグを入力して Enter（例：国宝、絵巻）">
    <!-- 今まで使ったタグを、入力の候補として出す -->
    <datalist id="tag-suggestions"></datalist>

    <label for="body">メモ</label>
    <textarea id="body" rows="8"></textarea>

    <!-- リンク：同じ作品のメモ、関連する作品のメモをつなぐ。変更はその場で保存される -->
    <fieldset id="links-box">
      <legend>リンク</legend>
      <p id="links-hint" hidden>このメモを一度「保存」すると、リンクを追加できます。</p>
      <div id="links-body">
        <p class="note">リンクの追加・解除は、「保存」を押さなくても、すぐに保存されます。</p>
        <h3>同じ作品のメモ（同一作品）</h3>
        <div id="same-list"></div>
        <!-- 同一作品のメモがあるときだけ出す：横に並べて見比べる画面への入口 -->
        <p id="compare-link" hidden>
          <a class="button" id="compare-anchor" href="compare.html">同じ作品のメモを並べて見比べる</a>
        </p>
        <h3>関連作品のメモ</h3>
        <div id="related-list"></div>

        <h3>リンクを追加</h3>
        <p>
          <input type="text" id="link-search" placeholder="作品名・展覧会名などで探す">
        </p>
        <p>
          つなぎ方：
          <select id="link-type">
            <option value="same">同一作品</option>
            <option value="related">関連作品</option>
          </select>
        </p>
        <div id="link-candidates"></div>
        <div class="message" id="link-message"></div>
      </div>
    </fieldset>

    <!-- PDFから取り込んだメモだけに出す：取り込み元と元のテキスト（読み取り専用） -->
    <details id="source-box" hidden>
      <summary>取り込み元の情報</summary>
      <p id="source-info"></p>
      <pre id="raw-text"></pre>
    </details>

    <div class="actions">
      <button type="submit">保存</button>
      <button type="button" id="delete" class="danger">このメモを削除</button>
    </div>
    <div class="message" id="message"></div>
  </form>

  <script src="db.js"></script>
  <script src="search.js"></script>
  <script src="links.js"></script>
  <script>
    // 目録情報の入力欄のid（memo.catalog の項目名と同じ）
    const CATALOG_FIELDS = ["no", "designation", "author", "period", "place", "quantity", "holder", "section"];

    const params = new URLSearchParams(location.search);
    let memo; // いま編集しているメモ

    // ----- タグ -----
    // 画面に付いているタグを表示する（×を押すと外れる）
    function renderTags() {
      const box = document.getElementById("tags");
      box.innerHTML = "";
      for (const tag of memo.tags) {
        const chip = document.createElement("span");
        chip.className = "tag";
        chip.textContent = tag;
        const x = document.createElement("button");
        x.type = "button"; // フォームの送信ボタンにならないようにする
        x.textContent = "×";
        x.title = "このタグを外す";
        x.addEventListener("click", () => {
          memo.tags = memo.tags.filter((t) => t !== tag);
          renderTags();
        });
        chip.appendChild(x);
        box.appendChild(chip);
      }
    }

    // タグを1つ追加する（前後の空白と先頭の # は取り、空や重複は無視）
    function addTag(text) {
      const tag = text.trim().replace(/^[#＃]+/, "").trim();
      if (tag && !memo.tags.includes(tag)) {
        memo.tags.push(tag);
        renderTags();
      }
    }

    const tagInput = document.getElementById("tag-input");
    tagInput.addEventListener("keydown", (e) => {
      // 日本語入力の変換を確定する Enter では追加しない（isComposing）
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault(); // 保存（フォーム送信）を防ぐ
        addTag(tagInput.value);
        tagInput.value = "";
      }
    });

    // これまで全メモで使われたタグを、入力の候補に入れる
    async function loadTagSuggestions() {
      const all = await MemoDB.getAll();
      const tags = [...new Set(all.flatMap((m) => m.tags))].sort();
      const list = document.getElementById("tag-suggestions");
      for (const t of tags) {
        const opt = document.createElement("option");
        opt.value = t;
        list.appendChild(opt);
      }
    }

    // ----- リンク -----
    // 「同一作品」（same）と「関連作品」（related）。メモには { targetId, type } の形で入っている。
    // 同一作品：つながりをたどる（A=B、B=C なら A=C）。関連作品：直接つないだものだけ。
    let isSaved = false; // このメモが保存済みか（新規は、最初の保存まで false）
    let allMemos = [];   // 全メモ（相手を探すため）

    // リンクの1行（メモへのリンク、補足、ボタン）を作る
    function linkRow(m, note, buttonLabel, onClick) {
      const div = document.createElement("div");
      div.className = "link-row";
      const a = document.createElement("a");
      a.href = "memo.html?id=" + encodeURIComponent(m.id);
      a.textContent = describe(m);
      div.appendChild(a);
      if (note) {
        const s = document.createElement("span");
        s.className = "sub";
        s.textContent = " " + note;
        div.appendChild(s);
      }
      if (buttonLabel) {
        const b = document.createElement("button");
        b.type = "button"; // フォームの送信ボタンにならないようにする
        b.textContent = buttonLabel;
        b.addEventListener("click", onClick);
        div.appendChild(b);
      }
      return div;
    }

    // describe() と findSameGroup() は links.js にある

    // リンクの欄を、最新の内容で表示し直す
    async function refreshLinks() {
      allMemos = await MemoDB.getAll();
      const byId = new Map(allMemos.map((m) => [m.id, m]));
      const self = byId.get(memo.id);
      if (!self) return;
      memo.links = self.links || []; // 自分のリンクは、保存されている最新のものに合わせる

      const unlink = (m) => async () => {
        memo.links = await MemoDB.removeLink(memo.id, m.id);
        document.getElementById("link-message").textContent = "リンクを解除しました";
        refreshLinks();
      };

      // 同一作品
      const sameBox = document.getElementById("same-list");
      sameBox.innerHTML = "";
      const via = findSameGroup(byId, memo.id);
      for (const [id, viaId] of via) {
        const m = byId.get(id);
        if (id === viaId) sameBox.appendChild(linkRow(m, "", "解除", unlink(m)));
        else sameBox.appendChild(linkRow(m, "（" + describe(byId.get(viaId)) + " を経由）", "", null));
      }
      if (via.size === 0) sameBox.textContent = "なし";
      // 見比べる画面への入口は、同一作品のメモがあるときだけ出す
      document.getElementById("compare-link").hidden = via.size === 0;
      document.getElementById("compare-anchor").href = "compare.html?id=" + encodeURIComponent(memo.id);

      // 関連作品（直接つないだものだけ）
      const relatedBox = document.getElementById("related-list");
      relatedBox.innerHTML = "";
      let relatedCount = 0;
      for (const l of memo.links) {
        const m = byId.get(l.targetId);
        if (l.type !== "related" || !m) continue;
        relatedBox.appendChild(linkRow(m, "", "解除", unlink(m)));
        relatedCount++;
      }
      if (relatedCount === 0) relatedBox.textContent = "なし";

      showCandidates();
    }

    // 「リンクを追加」の候補を表示する。
    // 言葉が入力されていれば検索、空なら「作品名が同じメモ」を出す（別の展覧会の同じ作品を見つけやすい）
    function showCandidates() {
      const query = document.getElementById("link-search").value;
      const linked = new Set(memo.links.map((l) => l.targetId)); // すでに直接つないだメモ
      const others = allMemos.filter((m) => m.id !== memo.id && !linked.has(m.id));

      let list, heading = "";
      if (query.trim()) {
        list = others.filter((m) => matchesQuery(m, query));
      } else {
        const title = normalize(memo.title.trim());
        list = title ? others.filter((m) => normalize(m.title.trim()) === title) : [];
        heading = list.length ? "作品名が同じメモ：" : "言葉を入力して探してください";
      }

      const box = document.getElementById("link-candidates");
      box.innerHTML = "";
      if (heading) box.append(heading);
      if (query.trim() && list.length === 0) box.append("見つかりませんでした");
      for (const m of list.slice(0, 20)) {
        box.appendChild(linkRow(m, "", "追加", async () => {
          const type = document.getElementById("link-type").value;
          memo.links = await MemoDB.addLink(memo.id, m.id, type);
          document.getElementById("link-message").textContent =
            "「" + (m.title || "（作品名なし）") + "」を" + (type === "same" ? "同一作品" : "関連作品") + "としてつなぎました";
          refreshLinks();
        }));
      }
      if (list.length > 20) box.append("（上位 20 件を表示。言葉を足して絞り込んでください）");
    }

    // リンク欄の表示：保存前の新規メモでは、案内だけを出す
    function showLinksBox() {
      document.getElementById("links-hint").hidden = isSaved;
      document.getElementById("links-body").hidden = !isSaved;
      if (isSaved) refreshLinks();
    }

    const linkSearch = document.getElementById("link-search");
    linkSearch.addEventListener("input", showCandidates);
    linkSearch.addEventListener("keydown", (e) => {
      if (e.key === "Enter") e.preventDefault(); // 保存（フォーム送信）を防ぐ
    });

    // 画面を開いたときの処理
    async function init() {
      if (params.get("new")) {
        memo = MemoDB.create();           // 新規：空のメモを用意
        document.getElementById("heading").textContent = "新しいメモ";
        document.getElementById("delete").hidden = true; // まだ保存前なので削除ボタンは隠す
      } else {
        memo = await MemoDB.get(params.get("id"));
        if (!memo) {
          document.getElementById("form").hidden = true;
          document.getElementById("heading").textContent = "メモが見つかりません";
          return;
        }
        document.getElementById("heading").textContent = memo.title || "（作品名なし）";
      }
      // メモの内容を入力欄に入れる
      document.getElementById("title").value = memo.title;
      document.getElementById("exhibition").value = memo.exhibition;
      document.getElementById("body").value = memo.body;
      for (const f of CATALOG_FIELDS) {
        document.getElementById(f).value = memo.catalog[f] || "";
      }
      renderTags();
      loadTagSuggestions();
      if (memo.source || memo.rawText) {
        document.getElementById("source-info").textContent = memo.source;
        document.getElementById("raw-text").textContent = memo.rawText;
        document.getElementById("source-box").hidden = false;
      }
      isSaved = !params.get("new"); // 新規は、最初の保存が終わるまで未保存
      showLinksBox();
    }

    // 「保存」ボタン
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault(); // ページの再読み込みを止める
      addTag(tagInput.value); // Enter を押し忘れた入力中のタグも拾う
      tagInput.value = "";
      memo.title = document.getElementById("title").value.trim();
      memo.exhibition = document.getElementById("exhibition").value.trim();
      memo.body = document.getElementById("body").value;
      for (const f of CATALOG_FIELDS) {
        memo.catalog[f] = document.getElementById(f).value.trim();
      }
      // リンクは別の操作でその場で保存されるので、保存されている最新のリンクを引き継ぐ
      // （古いリンクで上書きして、つないだリンクが消えるのを防ぐ）
      const current = await MemoDB.get(memo.id);
      if (current) memo.links = current.links || [];
      await MemoDB.save(memo);
      isSaved = true;
      showLinksBox(); // 新規メモは、ここでリンク欄が使えるようになる
      // 新規だった場合は、保存後に「編集」用のアドレスへ切り替える
      history.replaceState(null, "", "memo.html?id=" + encodeURIComponent(memo.id));
      document.getElementById("delete").hidden = false;
      document.getElementById("heading").textContent = memo.title || "（作品名なし）";
      document.getElementById("message").textContent = "保存しました";
    });

    // 「削除」ボタン（確認ダイアログを出してから消す）
    document.getElementById("delete").addEventListener("click", async () => {
      if (!confirm("このメモを削除します。元に戻せません。よろしいですか？")) return;
      await MemoDB.remove(memo.id);
      location.href = "index.html";
    });

    init();
  </script>
</body>
</html>
